<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>주식 간편 매매 레이더</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#0b1220;color:#eef4ff;font-family:system-ui,sans-serif;max-width:620px;margin:auto}
h1{font-size:22px;margin:8px 0}.muted{color:#9aabc3;font-size:12px}.card{background:#151f30;border:1px solid #29364a;border-radius:14px;padding:14px;margin:12px 0}
label{display:block;font-size:13px;color:#c8d5e8;margin:10px 0 5px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #3a4b63;background:#0b1627;color:white;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#3478ed;color:white;font-size:15px;font-weight:700;margin-top:12px}
.result{font-size:18px;font-weight:800;margin-top:12px;padding:12px;border-radius:10px;background:#253247}.good{color:#38d996}.bad{color:#ff9ca3}.neutral{color:#ffd27d}
.small{font-size:12px;color:#9aabc3;line-height:1.6}.stockname{font-weight:800;font-size:17px}
</style></head><body>
<h1>주식 간편 매매 레이더</h1><div class="muted">토스증권 현재가를 입력하면 보유 손익과 기준 가격을 계산합니다.</div>
<div class="card"><div class="stockname">삼성전자 · 005930</div>
<div class="grid"><div><label>현재가 (원)</label><input id="p0" type="number" inputmode="numeric" placeholder="현재가 입력"></div><div><label>평균매입가 (원)</label><input id="a0" type="number" value="261661" inputmode="numeric"></div></div>
<label>보유 수량 (주)</label><input id="q0" type="number" value="46" inputmode="numeric">
<button class="btn" onclick="calc(0)">삼성전자 계산</button><div id="r0" class="result">현재가를 입력하세요.</div></div>
<div class="card"><div class="stockname">SK하이닉스 · 000660</div>
<div class="grid"><div><label>현재가 (원)</label><input id="p1" type="number" inputmode="numeric" placeholder="현재가 입력"></div><div><label>평균매입가 (원)</label><input id="a1" type="number" value="1891235" inputmode="numeric"></div></div>
<label>보유 수량 (주)</label><input id="q1" type="number" value="9" inputmode="numeric">
<button class="btn" onclick="calc(1)">SK하이닉스 계산</button><div id="r1" class="result">현재가를 입력하세요.</div></div>
<div class="card"><b>계산 기준</b><p class="small">손익률 = (현재가 ÷ 평균매입가 - 1) × 100<br>손익금 = (현재가 - 평균매입가) × 수량<br>수수료·세금은 제외합니다. 입력한 가격을 바탕으로 한 계산이며 자동 매매 신호나 투자 권유가 아닙니다.</p><p class="small">※ 평균매입가와 수량은 이전에 알려주신 값을 기본 입력했습니다. 실제 보유 내역과 다르면 수정하세요.</p></div>
<script>
function won(n){return Math.round(n).toLocaleString("ko-KR")+"원"}
function calc(i){
 const p=Number(document.getElementById("p"+i).value),a=Number(document.getElementById("a"+i).value),q=Number(document.getElementById("q"+i).value),out=document.getElementById("r"+i);
 if(!(p>0&&a>0&&q>0)){out.textContent="현재가·평균매입가·수량을 모두 확인하세요.";return}
 const rate=(p/a-1)*100, profit=(p-a)*q, cls=rate>0?"good":rate<0?"bad":"neutral";
 out.innerHTML=`평가손익: <span class="${cls}">${won(profit)}</span><br>수익률: <span class="${cls}">${rate>0?"+":""}${rate.toFixed(2)}%</span><br>평가금액: ${won(p*q)}<br><span class="small">본전 가격(수수료·세금 제외): ${won(a)}</span>`;
}
</script></body></html>
